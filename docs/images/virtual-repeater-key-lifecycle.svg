<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Virtual repeater identity lifecycle</title>
  <desc id="desc">A diagram showing a virtual repeater using either a generated random private seed or an imported private key, deriving a separate public identity, and remaining disabled until explicitly enabled.</desc>
  <style>
    .bg{fill:#111418}.card{fill:#1a1f26;stroke:#2a313b;stroke-width:2}.accent{fill:#5cb3ff}.ok{fill:#4caf7a}.warn{fill:#e0a83e}.t{font-family:system-ui,sans-serif;fill:#d8dee6}.d{font-family:system-ui,sans-serif;fill:#8a94a3}.a{stroke:#5cb3ff;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5cb3ff"/></marker></defs>
  <rect class="bg" width="1200" height="430" rx="14"/>
  <text class="t" x="42" y="55" font-size="27" font-weight="700">Virtual Repeater identity: generated by default, importable by choice</text>
  <text class="d" x="42" y="84" font-size="17">The repeater has its own identity and never uses the Room's modem-held private key.</text>
  <rect class="card" x="42" y="128" width="310" height="205" rx="12"/>
  <text class="accent" x="68" y="169" font-size="20" font-weight="700">Choose a private seed</text>
  <circle class="ok" cx="79" cy="208" r="8"/><text class="t" x="98" y="214" font-size="16">Empty key: generate random 32 bytes</text>
  <text class="d" x="98" y="239" font-size="14">first time repeater is enabled</text>
  <circle class="warn" cx="79" cy="277" r="8"/><text class="t" x="98" y="283" font-size="16">Vanity key: import private material</text>
  <text class="d" x="98" y="308" font-size="14">only while repeater is disabled</text>
  <path class="a" d="M354 230 H505"/>
  <rect class="card" x="508" y="128" width="270" height="205" rx="12"/>
  <text class="accent" x="534" y="169" font-size="20" font-weight="700">Local private config</text>
  <text class="t" x="534" y="211" font-size="16">`repeater_key` saved</text>
  <text class="d" x="534" y="240" font-size="14">owner-only file mode 0600</text>
  <text class="d" x="534" y="267" font-size="14">never shown by dashboard/API</text>
  <path class="a" d="M780 230 H928"/>
  <rect class="card" x="932" y="128" width="225" height="205" rx="12"/>
  <text class="accent" x="956" y="169" font-size="20" font-weight="700">Repeater identity</text>
  <text class="t" x="956" y="210" font-size="16">Public key derived</text>
  <text class="d" x="956" y="240" font-size="14">Distinct from Room key</text>
  <text class="d" x="956" y="268" font-size="14">Enable and relay are</text>
  <text class="d" x="956" y="290" font-size="14">separate controls</text>
  <text class="d" x="42" y="383" font-size="16">Importing a key does not enable the repeater or turn on relaying. Both require explicit administrator action.</text>
</svg>
