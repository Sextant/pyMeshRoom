<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="405" viewBox="0 0 1120 405" role="img" aria-labelledby="title desc">
  <title id="title">MQTT Augmentation admin card</title><desc id="desc">A safe, credential-free reference of the inbound MQTT Augmentation dashboard card.</desc>
  <rect width="1120" height="405" rx="14" fill="#171d25"/><rect x="1" y="1" width="1118" height="403" rx="13" fill="none" stroke="#344150"/>
  <g font-family="Arial, sans-serif" fill="#e7edf5"><text x="30" y="47" fill="#58acff" font-size="21" font-weight="700">MQTT AUGMENTATION</text><text x="272" y="47" fill="#9baec2" font-size="15">admin only · read regional observer data alongside RF</text>
  <text x="30" y="88" font-size="16">☑ MQTT augmentation</text><text x="235" y="88" fill="#4cd28b" font-size="16">connected</text><text x="332" y="88" fill="#9baec2" font-size="16">· subscription granted · packets received: 42 · accepted: 39</text>
  <text x="55" y="124" font-size="16">☑ ACK ingestion</text><text x="270" y="124" fill="#9baec2" font-size="15">confirm matching deliveries</text><text x="55" y="156" font-size="16">☑ Message ingestion</text><text x="270" y="156" fill="#9baec2" font-size="15">capture direct room posts</text><text x="55" y="188" font-size="16">☑ Topology and advert ingestion</text><text x="344" y="188" fill="#9baec2" font-size="15">enrich known infrastructure</text><text x="55" y="220" font-size="16">☑ Activity monitor</text><text x="270" y="220" fill="#9baec2" font-size="15">wake eligible members</text>
  <line x1="30" y1="242" x2="1090" y2="242" stroke="#344150"/><text x="30" y="273" fill="#9baec2" font-size="14">BROKER / TRANSPORT / TOPIC FILTERS</text><text x="386" y="273" fill="#9baec2" font-size="14">SUBSCRIBER USERNAME / PASSWORD</text>
  <rect x="30" y="286" width="323" height="35" rx="3" fill="#f0f5fb"/><text x="43" y="309" fill="#17212b" font-size="15">mqtt.example.net · TLS WebSockets</text><rect x="386" y="286" width="245" height="35" rx="3" fill="#f0f5fb"/><text x="399" y="309" fill="#657382" font-size="15">read-only username</text><rect x="646" y="286" width="205" height="35" rx="3" fill="#f0f5fb"/><text x="660" y="309" fill="#657382" font-size="15">password stays hidden</text><rect x="872" y="284" width="190" height="39" rx="4" fill="#2b3c50"/><text x="891" y="309" font-size="15">Save settings</text>
  <rect x="30" y="345" width="1060" height="36" rx="4" fill="#202a35"/><text x="47" y="369" fill="#c8d6e6" font-size="15">RF remains authoritative: broker loss or denied subscription leaves the RF Room operating normally.</text></g>
</svg>
