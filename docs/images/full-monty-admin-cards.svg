<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><style>.b{fill:#111418}.c{fill:#1a1f26;stroke:#2a313b;stroke-width:2}.h{font:700 21px system-ui;fill:#5cb3ff}.t{font:16px system-ui;fill:#d8dee6}.d{font:14px system-ui;fill:#8a94a3}.g{fill:#4caf7a}.o{fill:#e0a83e}</style><rect class="b" width="1200" height="500" rx="14"/><text class="t" x="42" y="52" font-size="27" font-weight="700">Full Monty: RF-first room, optional connected services</text><rect class="c" x="42" y="95" width="350" height="350" rx="12"/><text class="h" x="68" y="135">MQTT OBSERVER</text><circle class="g" cx="76" cy="174" r="8"/><text class="t" x="95" y="180">Outbound copies of local RF</text><text class="d" x="68" y="222">• Add regional servers</text><text class="d" x="68" y="252">• Delete unused servers</text><text class="d" x="68" y="282">• TLS, JWT audience, topic prefix</text><text class="d" x="68" y="312">• Per-server health and traffic</text><text class="d" x="68" y="390">Never blocks radio receive</text><rect class="c" x="425" y="95" width="350" height="350" rx="12"/><text class="h" x="451" y="135">MQTT AUGMENTATION</text><circle class="o" cx="459" cy="174" r="8"/><text class="t" x="478" y="180">Inbound read-only observations</text><text class="d" x="451" y="222">• Broker, path, TLS, topic filters</text><text class="d" x="451" y="252">• Subscriber credentials</text><text class="d" x="451" y="282">• Granted / pending / denied status</text><text class="d" x="451" y="312">• ACK, posts, topology, activity</text><text class="d" x="451" y="390">RF remains authoritative</text><rect class="c" x="808" y="95" width="350" height="350" rx="12"/><text class="h" x="834" y="135">VIRTUAL REPEATER</text><circle class="o" cx="842" cy="174" r="8"/><text class="t" x="861" y="180">Second identity, shared KISS modem</text><text class="d" x="834" y="222">• Disabled by default</text><text class="d" x="834" y="252">• Generated or imported private key</text><text class="d" x="834" y="282">• Separate relay kill switch</text><text class="d" x="834" y="312">• Airtime and loop safeguards</text><text class="d" x="834" y="390">Enable only after RF validation</text></svg>
