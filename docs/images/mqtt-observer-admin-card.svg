<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">MQTT Observer admin card</title><desc id="desc">A safe, credential-free reference of the outbound Observer dashboard card.</desc>
  <rect width="1120" height="420" rx="14" fill="#171d25"/>
  <rect x="1" y="1" width="1118" height="418" rx="13" fill="none" stroke="#344150"/>
  <g font-family="Arial, sans-serif" fill="#e7edf5"><text x="30" y="47" fill="#58acff" font-size="21" font-weight="700">MQTT OBSERVER</text><text x="218" y="47" fill="#9baec2" font-size="15">admin only · publish local RF observations</text>
  <text x="30" y="89" font-size="16">☑ Enabled</text><text x="168" y="89" font-size="16">IATA</text><rect x="215" y="67" width="92" height="31" rx="3" fill="#f0f5fb"/><text x="226" y="89" fill="#17212b" font-size="16">SJC</text>
  <text x="334" y="89" font-size="16">☑ Status</text><text x="454" y="89" font-size="16">☑ Packets</text><text x="584" y="89" font-size="16">☑ RX</text><text x="678" y="89" font-size="16">Queue</text><rect x="738" y="67" width="84" height="31" rx="3" fill="#f0f5fb"/><text x="751" y="89" fill="#17212b" font-size="16">1000</text>
  <rect x="850" y="66" width="195" height="35" rx="4" fill="#2b3c50"/><text x="873" y="89" font-size="15">Save observer settings</text>
  <line x1="30" y1="122" x2="1090" y2="122" stroke="#344150"/><text x="30" y="153" fill="#9baec2" font-size="14">SERVER</text><text x="260" y="153" fill="#9baec2" font-size="14">ENDPOINT</text><text x="590" y="153" fill="#9baec2" font-size="14">STATE</text><text x="748" y="153" fill="#9baec2" font-size="14">LAST PUBLISH</text>
  <text x="30" y="187" font-size="17">GoMesh</text><text x="260" y="187" font-size="17">mqtt.gomesh.dev:443</text><text x="590" y="187" fill="#4cd28b" font-size="17">connected</text><text x="748" y="187" font-size="17">seconds ago</text>
  <text x="30" y="222" font-size="17">MeshMapper</text><text x="260" y="222" font-size="17">mqtt.meshmapper.net:443</text><text x="590" y="222" fill="#4cd28b" font-size="17">connected</text><text x="748" y="222" font-size="17">seconds ago</text>
  <rect x="29" y="259" width="1061" height="1" fill="#344150"/><text x="30" y="294" fill="#58acff" font-size="17" font-weight="700">ADD REGIONAL OBSERVER SERVER</text><text x="30" y="324" fill="#9baec2" font-size="15">Name, host, port, JWT audience, WebSocket path, topic prefix, and TLS settings</text>
  <rect x="30" y="347" width="1060" height="43" rx="4" fill="#202a35"/><text x="48" y="374" fill="#c8d6e6" font-size="15">Each destination is independent.  Observer failure never delays RF room operation.</text></g>
</svg>
